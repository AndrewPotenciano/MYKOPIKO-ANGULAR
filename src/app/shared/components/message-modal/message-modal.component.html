@if (open()) {
<div class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-body">
      @if (loading()) {
      <img src="/assets/images-2/coffee-loading.gif" alt="Loading..." class="loading-spinner" />
      }
      <p>{{ message() }}</p>
      @if (!loading()) {
      <button class="btn btn-primary" (click)="close()">OK</button>
      }
    </div>
  </div>
</div>
}

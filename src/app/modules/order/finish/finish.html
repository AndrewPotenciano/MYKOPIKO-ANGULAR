<!-- ================= FINISH BOX ================= -->
<div class="checkout-box finish-box">

	<!-- STEPS -->
	<div class="steps-wrapper">
		<div class="checkout-step">
			<div class="step-container">
				<div class="step-item completed">
					<img src="/assets/images-2/info.png" alt="Info">
				</div>
				<span class="step-label">{{ LABELS.labels.INFORMATION }}</span>
			</div>
			<span class="line active"></span>
			<div class="step-container">
				<div class="step-item completed">
					<img src="/assets/images-2/credit-card.png" alt="Payment">
				</div>
				<span class="step-label">{{ LABELS.labels.PAYMENT }}</span>
			</div>
			<span class="line active"></span>
			<div class="step-container">
				<div class="step-item active">
					<img src="/assets/images-2/express-delivery.png" alt="Delivery">
				</div>
				<span class="step-label">{{ LABELS.labels.CONFIRM }}</span>
			</div>
		</div>
	</div>

	<!-- CONTENT -->
	<div class="finish-content">

		<div class="success-icon">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="60" height="60">
				<path
					d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
			</svg>
		</div>

		<p class="order-status">Order Confirmed</p>

		<h1>{{ MESSAGES.FINISH.THANK_YOU }}</h1>
		<p class="subtitle">{{ MESSAGES.FINISH.ARRIVING_SOON }}</p>

		<p class="order-ref">
			<strong>{{ orderNumber }}</strong><br>
			{{ MESSAGES.FINISH.ESTIMATED_DELIVERY }}
		</p>

		<div class="finish-buttons">
			<button class="btn primary" (click)="trackOrder()">
				{{ LABELS.labels.TRACK_ORDER }}
			</button>
			<button class="btn outline" (click)="backHome()">{{ LABELS.labels.BACK_HOME }}</button>
		</div>

	</div>
</div>

<!-- MENU SECTION -->
<section id="menu" class="menu-section ">
	<div class="menu-image-header">
		<div class="overlay"></div>
		<div class="header-content px-4 py-4">
			<h1>Experience the Art of Coffee</h1>
			<p>Brewed to perfection, served with passion.</p>
		</div>
		<img src="assets/images/coffee-shop3.jpg" alt="Coffee Shop Ambiance">
	</div>
	<app-carousel class="carousel" [title]="LABELS.labels.POPULAR_MENU" [items]="popularMenuItems" [showDownHint]="true"
		[showSeparator]="false" [reveal]="true"></app-carousel>
	<app-carousel [title]="LABELS.labels.FRAPPE_MENU" [items]="frappeMenuItems"></app-carousel>
	<app-carousel [title]="LABELS.labels.ESPRESSO_MENU" [items]="espressoMenuItems"></app-carousel>
	<app-carousel [title]="LABELS.labels.PASTRIES_MENU" [items]="pastriesMenuItems"></app-carousel>
</section>

<!-- MENU SECTION -->
<section id="menu" class="menu-section ">
	<div class="menu-image-header">
		<div class="overlay"></div>
		<div class="header-content">
			<h1>Experience the Art of Coffee</h1>
			<p>Brewed to perfection, served with passion.</p>
		</div>
		<img src="assets/images/coffee-shop3.jpg" alt="Coffee Shop Ambiance">
	</div>
	<app-carousel class="carousel" [title]="'Popular Menu'" [items]="popularMenuItems" [showDownHint]="true"
		[showSeparator]="false" [reveal]="true"></app-carousel>
	<app-carousel [title]="'Frappe Menu'" [items]="frappeMenuItems"></app-carousel>
	<app-carousel [title]="'Espresso Menu'" [items]="espressoMenuItems"></app-carousel>
	<app-carousel [title]="'Pastries Menu'" [items]="pastriesMenuItems"></app-carousel>
</section>

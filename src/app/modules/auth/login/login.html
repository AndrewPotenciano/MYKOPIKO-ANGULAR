<section class="login-page">
  <div class="login-card">
    <div class="login-left">
      <h1 class="login-brand">MYKOPIKO</h1>
      <img src="/assets/images/login-page-logo.png" class="login-logo" alt="Login logo" />
    </div>
    <div class="login-right">
      <h2 class="login-title">Welcome back</h2>
      <p class="login-subtitle">{{ MESSAGES.LOGIN_SIGN_IN }}</p>
      <p class="login-detail">
        {{ MESSAGES.LOGIN_DESCRIPTION }}
      </p>
      <button type="button" class="btn btn-lg btn-block btn-facebook">
        <img src="/assets/images-2/facebook.png" width="18" height="18" alt="Facebook" />
        <span>{{ MESSAGES.LOGIN_CONTINUE_FACEBOOK }}</span>
      </button>

      <button type="button" class="btn btn-lg btn-block btn-google" (click)="loginWithGoogle($event)">
        <i class="fab fa-google"></i>
        <span>{{ MESSAGES.LOGIN_CONTINUE_GOOGLE }}</span>
      </button>

      <p class="login-note">{{ MESSAGES.LOGIN_TERMS }}</p>
    </div>
  </div>
</section>

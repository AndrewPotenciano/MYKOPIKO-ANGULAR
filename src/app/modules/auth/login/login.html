<section class="login-page">
	<div class="login-card">
		<div class="login-left">
			<h1 class="login-brand">MYKOPIKO</h1>
			<img src="/assets/images/login-page-logo.png" class="login-logo" alt="Login logo">
		</div>
		<div class="login-right">
			<h2 class="login-title">Welcome back</h2>
			<p class="login-subtitle">Sign in to continue</p>
			<p class="login-detail">
				Buy Coffees, access your orders, track deliveries, and enjoy exclusive member perks.
			</p>
			<button type="button" class="btn btn-lg btn-block btn-facebook">
				<img src="/assets/images-2/facebook.png" width="18" height="18" alt="Facebook" />
				<span>Continue With Facebook</span>
			</button>

			<button type="button" class="btn btn-lg btn-block btn-google" (click)="loginWithGoogle($event)">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
					<path d="M21.35 11.1h-9.18v2.92h5.26c-.23 1.26-1.43 3.68-5.26 3.68-3.16 0-5.74-2.63-5.74-5.87s2.58-5.87 5.74-5.87c1.8 0 3 0.77 3.7 1.43l2.52-2.43C17.31 3.47 14.9 2.5 11.92 2.5 6.97 2.5 2.86 6.57 2.86 11.5s4.11 9 9.06 9c5.22 0 8.67-3.65 8.67-8.8 0-.62-.07-1.1-.24-1.6z" fill="#fff"/>
				</svg>
				<span>Continue with Google</span>
			</button>

			<p class="login-note">By continuing, you agree to our Terms & Privacy Policy.</p>
		</div>
	</div>
</section>
